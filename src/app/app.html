<main [class]="theme()" class="motion base">
  <router-outlet></router-outlet>

  <div class="actions-overlay">
    <div class="actions-overlay-content">
      <app-icon-button (buttonClick)="toggleTheme()" [icon]="theme() === 'dark' ? 'ph-moon' : 'ph-sun'"
        variant="outlined" ariaLabel="Change color theme"></app-icon-button>
      <app-stepper [allSteps]="steps" [initialStepIndex]="currentStepIndex()"
        (currentStep)="handleStepChange($event)"></app-stepper>
    </div>
  </div>
</main>
