<div ngToolbar [ariaLabel]="toolbarAriaLabel()">
  <div ngToolbarWidgetGroup role="radiogroup" [ariaLabel]="groupAriaLabel()">
    @for(button of buttons(); track button.id) {
    <button ngToolbarWidget class="md-typescale-body-medium" (click)="handleButtonChange(button)"
      [value]="button.value">
      {{ button.text }}
    </button>
    }
  </div>
</div>
