name: Build and deploy application

env:
  nodeJsVersion: 24.10.0

on:
  workflow_call:
    outputs:
      pageUrl:
        description: "URL of the deployed environment"
        value: ${{ jobs.deploy.outputs.PAGE_URL }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup NodeJs
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.nodeJsVersion }}
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run github-build
      - name: Copy index.html as 404.html
        id: copy-index
        run: cp ./dist/women-techstyle-summit/browser/index.html ./dist/women-techstyle-summit/browser/404.html
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/women-techstyle-summit/browser/
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      PAGE_URL: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy application to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
